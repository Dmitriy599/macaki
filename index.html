<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Макаки — проект по информатике</title>
<style>
    :root {
        --bg: #1e2226;
        --panel: #2a2f34;
        --text: #e8e8e8;
        --muted: #a0a6ab;
        --accent: #3d7a5c;
        --accent-hover: #4f9573;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.7;
    }
    header {
        background: linear-gradient(135deg, #23282c 0%, #1a1e21 100%);
        padding: 90px 20px 70px;
        text-align: center;
        border-bottom: 3px solid var(--accent);
    }
    header h1 {
        font-size: 3rem;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
    }
    header p {
        color: var(--muted);
        margin-top: 12px;
        font-size: 1.1rem;
        letter-spacing: 1px;
    }
    nav {
        background: var(--panel);
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        justify-content: center;
        gap: 40px;
        padding: 18px;
        border-bottom: 1px solid #3a4046;
    }
    nav a {
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
        font-size: 0.9rem;
        transition: color 0.25s;
    }
    nav a:hover { color: var(--accent-hover); }
    .container {
        max-width: 1000px;
        margin: 0 auto;
        padding: 60px 20px;
    }
    section { margin-bottom: 90px; }
    section h2 {
        font-size: 1.9rem;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 30px;
        padding-left: 16px;
        border-left: 5px solid var(--accent);
    }
    .card {
        background: var(--panel);
        border-radius: 8px;
        overflow: hidden;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        min-height: 280px;
    }
    .card .text {
        padding: 35px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    .card .text p { color: var(--muted); margin-bottom: 14px; }
    .card .text p:last-child { margin-bottom: 0; }
    .facts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        margin-top: 30px;
    }
    .fact {
        background: var(--panel);
        border-left: 4px solid var(--accent);
        padding: 22px;
        border-radius: 6px;
    }
    .fact h3 {
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--accent-hover);
        margin-bottom: 8px;
    }
    .fact p { color: var(--muted); font-size: 0.95rem; }
    footer {
        background: #171a1d;
        text-align: center;
        padding: 30px;
        color: var(--muted);
        font-size: 0.9rem;
        border-top: 1px solid #2f353a;
    }
    @media (max-width: 700px) {
        .card { grid-template-columns: 1fr; }
        header h1 { font-size: 2rem; }
        nav { gap: 20px; flex-wrap: wrap; }
    }
</style>
</head>
<body>

<header>
    <h1>Макаки</h1>
    <p>Проект по информатике · 9 класс</p>
</header>

<nav>
    <a href="#life">Как живут</a>
    <a href="#food">Чем питаются</a>
    <a href="#facts">Интересные факты</a>
</nav>

<div class="container">

    <section id="life">
        <h2>Как живут</h2>
        <div class="card">
